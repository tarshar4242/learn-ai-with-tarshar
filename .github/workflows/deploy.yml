name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 雙路徑檢索台（綠區歷史）：2026-10-23 起停止自動重抓／重算。
      # 原因：檢索台屬 10/22 以前的綠區研究設計，已凍結為歷史；每次部署重算會悄悄改變歷史頁面。
      # 現在直接沿用 repo 裡已有的 public/thesis-library/tools/dual-search/index.html，整站部署照常。
      # 日後若真的要手動重建：本機在 tools/dual-search 跑 pipeline.py 與 embed_build.mjs（template.html 已含綠區橫幅），再 commit 產出的 index.html。
      # 還原自動重建：把下面註解掉的步驟取消註解即可。
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      # - name: Build dual-search corpus
      #   continue-on-error: true
      #   run: |
      #     pip install pymupdf
      #     cd tools/dual-search && npm ci && python3 pipeline.py && node embed_build.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
