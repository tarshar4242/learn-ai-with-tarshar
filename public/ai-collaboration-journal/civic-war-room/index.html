<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">

  <title>AI 協作日誌｜公務生態系戰情室</title>
  <meta name="description" content="公務生態系戰情室從構想到第一版的 AI 協作日誌。">
  <style>
    :root { --ink:#17352f; --muted:#5f716d; --paper:#fbf8f0; --card:#fffdf8; --line:#d9dfd8; --green:#1f6657; --gold:#cf8c39; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:linear-gradient(180deg,#e9f2ed 0,#f7f1e5 44rem); font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif; line-height:1.75; }
    a { color:inherit; }
    header, main, footer { width:min(1080px,calc(100% - 32px)); margin:auto; }
    header { padding:28px 0 18px; }
    .back { display:inline-flex; text-decoration:none; color:var(--green); font-weight:700; margin-bottom:28px; }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,380px); gap:40px; align-items:center; padding:44px; border:1px solid rgba(31,102,87,.2); border-radius:28px; background:rgba(255,253,248,.9); box-shadow:0 18px 60px rgba(23,53,47,.10); }
    .eyebrow { color:var(--gold); font-weight:800; letter-spacing:.12em; }
    h1 { margin:.25em 0; font-family:"Noto Serif TC","Songti TC",serif; font-size:clamp(2rem,5vw,4.4rem); line-height:1.12; }
    .lead { color:var(--muted); font-size:1.08rem; }
    .cover { width:100%; border-radius:18px; box-shadow:0 14px 36px rgba(23,53,47,.18); }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:11px 20px; border:1px solid var(--green); border-radius:999px; text-decoration:none; font-weight:800; }
    .button.primary { color:white; background:var(--green); }
    main { padding:22px 0 64px; }
    .about { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .about article { padding:24px; border:1px solid var(--line); border-radius:20px; background:var(--card); }
    h2 { margin:.2em 0 .55em; font-size:1.2rem; }
    p { margin:.45em 0; }
    footer { padding:24px 0 42px; color:var(--muted); font-size:.9rem; }
    @media (max-width:760px) { .hero { grid-template-columns:1fr; padding:26px; } .cover { max-width:420px; margin:auto; } .about { grid-template-columns:1fr; } .button { flex:1 1 100%; } }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../../civic-war-room/?k=145">← 回公務生態系戰情室</a>
    <section class="hero">
      <div>
        <p class="eyebrow">AI 協作日誌 · 修訂版 v2.0</p>
        <h1>公務生態系戰情室<br>從構想到第一版</h1>
        <p class="lead">這份日誌記錄平台如何從需求、盤點、設計、建造到正式上線。小插曲收進附註，主線聚焦「這個工具怎麼被做出來」。</p>
        <div class="actions">
          <a class="button primary" href="journal.html">線上閱讀完整日誌</a>
          <a class="button" href="journal.pdf" download>下載 PDF</a>
          <a class="button" href="journal.docx" download>下載 Word</a>
        </div>
      </div>
      <img class="cover" src="cover.png" alt="公務生態系戰情室 AI 協作日誌封面">
    </section>
  </header>
  <main>
    <section class="about" aria-label="日誌內容摘要">
      <article><h2>從需求開始</h2><p>說明為什麼需要每日工作入口，以及熟成局、Notion、Google 服務如何成為既有基礎。</p></article>
      <article><h2>把系統做出來</h2><p>記錄需求收斂、工作卡規則、資料流程、入口整合、日曆與甘特圖的形成。</p></article>
      <article><h2>驗證與接續</h2><p>整理部署、操作驗證、茜茜覆核、目前限制，以及下一階段值得優先補上的工作。</p></article>
    </section>
  </main>
  <footer>整理：知臨｜依原始需求、前置方案與實作證據</footer>

</html>
