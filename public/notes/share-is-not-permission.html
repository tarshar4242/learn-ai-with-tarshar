<span class="tag">安全觀念</span><h1>網址不是權限</h1><p class="lead">知道網址不代表應該看見整座網站；真正的分享要有範圍與期限。</p>
<article class="card"><p>當我們把一個公開網址交給朋友時，交出去的不只是一個入口。如果頁面仍能回到首頁、上一層或其他內容，對方實際取得的可能是整座網站。</p>
<p>可控分享的做法，是讓每一張通行證只對應一組明確內容。即使有人猜到其他頁面的網址，伺服器也要再次確認：這張通行證有沒有被授權讀取這一頁。</p>
<div class="quote">網址是入口，權限才是門鎖。</div>
<div class="grid"><section class="mini"><b>網址回答</b>從哪裡進去。</section><section class="mini"><b>權限回答</b>進去後可以看什麼、看到什麼時候。</section></div></article>
