<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-label="AI 夥伴小機器人">
  <!-- Learn AI with Tarshar｜AI 夥伴：白色圓潤小機器人，青綠光點眼睛，胸口幸運草（依 DESIGN.md 形象 C 與 character-xiaod 規則）-->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE6F2"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/><stop offset="1" stop-color="#0F1A33"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1BB39A" stop-opacity=".9"/><stop offset="1" stop-color="#1BB39A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- 影子 -->
  <ellipse cx="120" cy="288" rx="70" ry="9" fill="#000" opacity=".18"/>
  <!-- 天線 -->
  <rect x="116" y="18" width="8" height="26" rx="4" fill="#C9D4E4"/>
  <circle cx="120" cy="16" r="10" fill="url(#glow)"/>
  <circle cx="120" cy="16" r="6" fill="#1BB39A"/>
  <!-- 頭 -->
  <rect x="42" y="40" width="156" height="120" rx="60" fill="url(#body)" stroke="#B9C7DA" stroke-width="2"/>
  <!-- 臉屏 -->
  <rect x="62" y="62" width="116" height="76" rx="38" fill="url(#face)"/>
  <!-- 眼睛（青綠光點）-->
  <ellipse cx="97" cy="98" rx="11" ry="14" fill="#1BB39A" filter="url(#soft)" opacity=".7"/>
  <ellipse cx="143" cy="98" rx="11" ry="14" fill="#1BB39A" filter="url(#soft)" opacity=".7"/>
  <ellipse cx="97" cy="98" rx="8" ry="11" fill="#5FE3CB"/>
  <path d="M135 98 h16" stroke="#5FE3CB" stroke-width="5" stroke-linecap="round"/>
  <!-- 微笑 -->
  <path d="M106 124 h28" stroke="#5FE3CB" stroke-width="4" stroke-linecap="round"/>
  <!-- 耳朵 -->
  <rect x="30" y="86" width="16" height="34" rx="8" fill="#C9D4E4"/>
  <rect x="194" y="86" width="16" height="34" rx="8" fill="#C9D4E4"/>
  <!-- 身體 -->
  <rect x="58" y="166" width="124" height="104" rx="44" fill="url(#body)" stroke="#B9C7DA" stroke-width="2"/>
  <!-- 手 -->
  <rect x="26" y="180" width="34" height="62" rx="17" fill="url(#body)" stroke="#B9C7DA" stroke-width="2" transform="rotate(14 43 211)"/>
  <rect x="180" y="180" width="34" height="62" rx="17" fill="url(#body)" stroke="#B9C7DA" stroke-width="2" transform="rotate(-14 197 211)"/>
  <!-- 胸口幸運草 -->
  <g transform="translate(120 214)">
    <circle r="26" fill="#0F1A33" opacity=".08"/>
    <g fill="#2F8F62">
      <circle cx="-8" cy="-8" r="8.5"/><circle cx="8" cy="-8" r="8.5"/><circle cx="-8" cy="8" r="8.5"/><circle cx="8" cy="8" r="8.5"/>
    </g>
    <g fill="#8FD14F">
      <circle cx="-8" cy="-8" r="5"/><circle cx="8" cy="-8" r="5"/><circle cx="-8" cy="8" r="5"/><circle cx="8" cy="8" r="5"/>
    </g>
    <path d="M2 10 L6 26" stroke="#2F8F62" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <text x="196" y="52" font-family="Inter,Arial" font-size="34" font-weight="800" fill="#5FE3CB">?</text>
  <!-- 腳 -->
  <rect x="76" y="262" width="34" height="22" rx="11" fill="#C9D4E4"/>
  <rect x="130" y="262" width="34" height="22" rx="11" fill="#C9D4E4"/>
</svg>
