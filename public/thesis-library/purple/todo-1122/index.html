/* ===== 以下是程式，不用改 ===== */
var P='todo1122:';
function sget(k){try{return localStorage.getItem(P+k)}catch(e){return null}}
function sset(k,v){try{if(v===null||v===''){localStorage.removeItem(P+k)}else{localStorage.setItem(P+k,v)}}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

var SECTIONS=[
 {name:'一、這幾天要做的事',sub:'依優先順序排列，有截止日的會標出來。',items:ACTIONS,kind:'act'},
 {name:'二、優先閱讀文獻',sub:'共 25 篇，編號已換成現行編號（11/24），本週順序見「本週十篇文獻」頁。每篇讀完，勾選並寫一句結論。',items:PAPERS,kind:'paper'},
 {name:'三、1122 會後整理文件',sub:'這一區只要打勾「已看過」。',items:DOCS,kind:'doc'}
];
var ALL=[];
SECTIONS.forEach(function(s){s.items.forEach(function(i){i._s=s;ALL.push(i)})});
var filter='all';

function itemHtml(i,kind){
  var tags='';
  if(i.star)tags+='<span class="tag s">★先讀</span>';
  if(i.due)tags+='<span class="tag d">截止 '+esc(i.due)+'</span>';
  if(i.ask)tags+='<span class="tag d">請老師協助取得</span>';
  if(kind==='paper')tags+='<span class="tag">'+esc(i.no||i.id)+'</span>';
  var links=i.links&&i.links.length?i.links.map(function(l){return '<a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'}).join(''):'<span class="nolink">無連結</span>';
  var lab=kind==='doc'?'已看過':'看過並有結論';
  var tit=(i.links&&i.links[0])?'<a href="'+esc(i.links[0][1])+'" target="_blank" rel="noopener">'+esc(i.t)+'</a>':esc(i.t);
  var concl=kind==='doc'?'':'<details class="c"><summary>我的結論</summary><textarea data-c="'+i.id+'" placeholder="一句話寫下結論"></textarea></details>';
  return '<div class="item'+(i.star?' star':'')+'" data-id="'+i.id+'"><div class="row"><input type="checkbox" id="k_'+i.id+'" data-k="'+i.id+'" aria-label="'+lab+'"><div style="flex:1"><div class="ttl">'+tags+tit+'</div>'+(i.d?'<div class="desc">'+esc(i.d)+'</div>':'')+'<div class="links">'+links+'</div><label for="k_'+i.id+'" class="desc">☑ '+lab+'</label>'+concl+'</div></div></div>';
}
function build(){
  var h='';
  SECTIONS.forEach(function(s,si){
    h+='<section class="blk"><h2>'+s.name+'</h2><p class="cnt" id="cnt'+si+'"></p><p class="sub">'+s.sub+'</p>';
    if(s.kind==='paper'){
      var last='';
      var order=s.items.slice().sort(function(a,b){return (b.star?1:0)-(a.star?1:0)});
      var starred=order.filter(function(i){return i.star});
      h+='<h3>★ 最先讀（A35、B09、B08、A05）</h3>'+starred.map(function(i){return itemHtml(i,'paper')}).join('');
      var gname={A:'問卷與理論模型（研究問題一）',B:'RAG 回答正確性評估（研究問題二）',C:'研究方法相同（關鍵字對語意、使用者實驗）',D:'隱性知識外化與核心理論（11/23 補）'};
      var cur='';
      s.items.forEach(function(i){
        if(i.star)return;
        var g=i.id.charAt(0);
        if(g!==cur){cur=g;h+='<h3>'+gname[g]+'</h3>'}
        h+=itemHtml(i,'paper');
      });
    }else{
      h+=s.items.map(function(i){return itemHtml(i,s.kind)}).join('');
    }
    h+='</section>';
  });
  document.getElementById('app').innerHTML=h;
  ALL.forEach(function(i){
    var cb=document.getElementById('k_'+i.id);
    if(cb)cb.checked=sget('k:'+i.id)==='1';
    var ta=document.querySelector('textarea[data-c="'+i.id+'"]');
    if(ta){var v=sget('c:'+i.id);if(v)ta.value=v}
  });
  refresh();
}
function refresh(){
  var tot=0,done=0;
  SECTIONS.forEach(function(s,si){
    var d=0;s.items.forEach(function(i){var cb=document.getElementById('k_'+i.id);if(cb&&cb.checked)d++});
    tot+=s.items.length;done+=d;
    document.getElementById('cnt'+si).textContent='本區已打勾 '+d+'／'+s.items.length;
  });
  document.getElementById('total').textContent='已打勾 '+done+'／'+tot;
  document.getElementById('fill').style.width=(tot?Math.round(done/tot*100):0)+'%';
  ALL.forEach(function(i){
    var el=document.querySelector('.item[data-id="'+i.id+'"]');var cb=document.getElementById('k_'+i.id);
    if(!el||!cb)return;
    el.classList.toggle('done',cb.checked);
    el.classList.toggle('hide',(filter==='todo'&&cb.checked)||(filter==='done'&&!cb.checked));
  });
}
document.addEventListener('change',function(e){
  var k=e.target.getAttribute&&e.target.getAttribute('data-k');
  if(k){sset('k:'+k,e.target.checked?'1':null);refresh()}
});
document.addEventListener('input',function(e){
  var c=e.target.getAttribute&&e.target.getAttribute('data-c');
  if(c)sset('c:'+c,e.target.value)
});
document.querySelector('.filters').addEventListener('click',function(e){
  var f=e.target.getAttribute('data-f');if(!f)return;filter=f;
  [].forEach.call(document.querySelectorAll('.filters button'),function(b){b.classList.toggle('on',b===e.target)});refresh();
});

function exportText(){
  var lines=['1122待辦進度｜匯出 '+new Date().toISOString().slice(0,10)];
  ALL.forEach(function(i){
    var cb=document.getElementById('k_'+i.id);var c=(sget('c:'+i.id)||'').replace(/\r?\n/g,'↵');
    var on=cb&&cb.checked;
    if(on||c)lines.push((on?'✔ ':'… ')+i.id+'｜'+(i.no?i.no+' ':'')+i.t+(c?'｜結論：'+c:''));
  });
  if(lines.length===1)lines.push('（目前沒有打勾或結論）');
  return lines.join('\n');
}
function say(m){document.getElementById('msg').textContent=m}
document.getElementById('exp').onclick=function(){
  var box=document.getElementById('box');box.value=exportText();
  var ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(box.value).then(function(){say('已複製到剪貼簿，也列在上面的框裡。')},function(){fb()});ok=true}}catch(e){}
  function fb(){try{box.focus();box.select();say(document.execCommand('copy')?'已複製到剪貼簿，也列在上面的框裡。':'請長按上面的框，選全部後複製。')}catch(e){say('請長按上面的框，選全部後複製。')}}
  if(!ok)fb();
};
document.getElementById('imp').onclick=function(){
  var txt=document.getElementById('box').value.split(/\r?\n/);var n=0;
  txt.forEach(function(line){
    var m=line.match(/^(✔|…)\s*([A-Za-z0-9]+)｜(.*)$/);if(!m)return;
    var id=m[2];var item=ALL.filter(function(i){return i.id===id})[0];if(!item)return;
    var c='';var ci=m[3].indexOf('｜結論：');
    if(ci>=0)c=m[3].slice(ci+4).replace(/↵/g,'\n');
    else if(m[3].indexOf('結論：')===0)c=m[3].slice(3).replace(/↵/g,'\n');
    if(m[1]==='✔')sset('k:'+id,'1');
    if(c)sset('c:'+id,c);
    n++;
  });
  build();say(n?'已匯入 '+n+' 項。':'沒有讀到可匯入的項目，請確認貼的是匯出的文字。');
};
build();
</script>
