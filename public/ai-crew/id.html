<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>領取小組成員證</title>
<meta name="theme-color" content="#2F8F62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="shared/site.css">
<style>
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.hint { margin: 0; text-align: center; font-size: 13px; color: var(--ink-soft); }
.confirm { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.confirm dt { color: var(--ink-soft); font-weight: 700; }
.confirm dd { margin: 0; font-weight: 700; }
.warn { padding: 10px 14px; border-radius: 12px; background: #FFF3E6; color: #7A4A21; font-size: 13px; }
</style>
</head>
<body>
<header class="site-head" id="head"></header>
<main class="page">

  <div id="intro">
    <span class="eyebrow" id="season">AI 陪跑工作坊</span>
    <h1 class="page-title">領取小組成員證</h1>
    <p class="lead">三個步驟，一分鐘領到你的證。<span class="nb">領證後解鎖小組空間。</span></p>
    <ol class="steps" id="steps"><li aria-current="step">1 選主題小組</li><li>2 名字與照片</li><li>3 領證</li></ol>
  </div>

  <section class="card step" id="stepGroup">
    <label class="lbl" id="groupLbl">你最想解決哪一個主題？</label>
    <div class="chips" id="groups" role="group" aria-labelledby="groupLbl"></div>
    <p class="note">每一組有自己的講義、實作存檔和進度。一人只能加入一組，選好再往下。</p>
    <div class="row"><button class="btn" id="toFormBtn" type="button" disabled>下一步</button></div>
  </section>

  <section class="card step" id="stepForm" hidden>
    <label class="lbl" id="avatarLbl">大頭貼</label>
    <div class="avatarPick">
      <button class="pick" id="pickBtn" type="button" aria-labelledby="avatarLbl" aria-describedby="avatarNote">
        <img class="prev" id="avatarPrev" alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23EEF7F1'/%3E%3Ccircle cx='50' cy='38' r='16' fill='%232F8F62'/%3E%3Cpath d='M18 92a32 32 0 0 1 64 0z' fill='%232F8F62'/%3E%3C/svg%3E">
        <span class="cam" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h3l1.5-2.5h7L17 8.5h3v10H4z"/><circle cx="12" cy="13.5" r="3.2"/></svg></span>
      </button>
      <input id="avatarInput" type="file" accept="image/*" hidden>
      <p class="note" id="avatarNote">點大頭貼可以放照片。照片只留在你的手機裡，不會上傳到任何地方。</p>
    </div>
    <label class="lbl" for="nameInput">證上要印的名字</label>
    <input class="field" id="nameInput" maxlength="12" placeholder="名字或暱稱，最多 12 個字" autocomplete="nickname">
    <p class="note">用報名時的名字，才能對上老師的名冊和序號。</p>
    <dl class="confirm"><dt>小組</dt><dd id="confirmGroup"></dd></dl>
    <div class="row">
      <button class="btn ghost" id="backBtn" type="button">回上一步</button>
      <button class="btn" id="genBtn" type="button" disabled>領取成員證</button>
    </div>
  </section>

  <section class="card step" id="stepClosed" hidden>
    <p class="note">小組報名還沒開放，開放後就能領取。</p>
    <div class="row"><a class="btn" href="./">回首頁</a></div>
  </section>

  <section class="step" id="result" hidden>
    <div class="cardFrame" id="cardFrame" data-state="loading">
      <img id="cardImg" alt="我的小組成員證">
      <span class="placeholder" role="status">成員證繪製中…</span>
    </div>
    <p class="hint" id="unlistedNote" hidden></p>
    <p class="hint">分享給同組的夥伴，也可以存到手機</p>
    <div class="actions">
      <button class="btn light" id="shareBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>分享</button>
      <button class="btn light" id="dlBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 20h14"/></svg>下載</button>
    </div>
    <div class="row">
      <button class="btn ghost" id="photoBtn" type="button">換照片</button>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <button class="btn ghost" id="resetBtn" type="button">重新領取</button>
    </div>
    <div class="row"><a class="btn block" id="nextBtn" href="./">前往小組空間</a></div>
  </section>

</main>
<footer class="foot" id="foot">🍀 Learn AI with Tarshar | 2026</footer>

<script src="shared/site.js"></script>
<script src="shared/crew-card.js"></script>
<script>
(async () => {
  const { Card, loadConfig, groupOf, assignSerial, todayTW, siteHeader, toast } = AICrew;
  const $ = (id) => document.getElementById(id);
  siteHeader($("head"));
  const params = new URLSearchParams(location.search);
  const next = params.get("next");
  let cfg = null;
  try { cfg = await loadConfig(); } catch (e) { console.error(e); toast("設定檔讀不到，稍後再試"); return; }
  $("season").textContent = cfg.workshop.name + "・" + cfg.workshop.season;
  $("foot").textContent = "🍀 " + cfg.workshop.signature;
  siteHeader($("head"), { title: cfg.workshop.name });
  const meta = { workshop: cfg.workshop.name, season: cfg.workshop.season, signature: cfg.workshop.signature, slogan: cfg.workshop.slogan };

  let groupId = "", avatarBitmap = null, lastBlob = null, lastUrl = "";
  const setStep = (n) => [...$("steps").children].forEach((li, i) => i === n ? li.setAttribute("aria-current", "step") : li.removeAttribute("aria-current"));
  const show = (id) => {
    for (const s of ["stepGroup", "stepForm", "stepClosed", "result"]) $(s).hidden = s !== id;
    $("intro").hidden = id === "result";
  };

  /* 步驟一：主題小組 */
  for (const g of cfg.groups) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<b><i class="dot" style="background:${g.color}"></i>${g.name}</b><small>${g.tagline || ""}</small>`;
    b.addEventListener("click", () => {
      groupId = g.id;
      for (const o of $("groups").querySelectorAll(".chip")) o.setAttribute("aria-pressed", String(o === b));
      $("toFormBtn").disabled = false;
    });
    $("groups").append(b);
  }
  $("toFormBtn").addEventListener("click", () => {
    if (!groupId) return;
    const g = groupOf(cfg, groupId);
    $("confirmGroup").innerHTML = `<i class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:${g.color}"></i>${g.name}`;
    show("stepForm");
    setStep(1);
    $("nameInput").focus();
  });
  $("backBtn").addEventListener("click", () => { show("stepGroup"); setStep(0); });

  /* 步驟二：照片與名字（照片在瀏覽器裡裁成正方形、縮到 640px） */
  async function loadAvatar(file) {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), s = Math.min(1, 640 / side);
    const c = document.createElement("canvas");
    c.width = c.height = Math.round(side * s);
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    return c;
  }
  const photoJpeg = (bmp) => {
    const c = document.createElement("canvas");
    c.width = c.height = 480;
    c.getContext("2d").drawImage(bmp, 0, 0, 480, 480);
    return c.toDataURL("image/jpeg", 0.85);
  };
  $("pickBtn").addEventListener("click", () => $("avatarInput").click());
  $("avatarInput").addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try { avatarBitmap = await loadAvatar(f); $("avatarPrev").src = avatarBitmap.toDataURL("image/jpeg", 0.85); }
    catch { toast("照片讀取失敗，換一張試試"); }
  });
  $("nameInput").addEventListener("input", () => { $("genBtn").disabled = $("nameInput").value.trim().length === 0; });

  /* 步驟三：產證 */
  async function showCard(card) {
    show("result");
    $("cardFrame").dataset.state = "loading";
    const canvas = await CrewCard.renderStory(card, meta);
    lastBlob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.92));
    lastUrl = canvas.toDataURL("image/jpeg", 0.92);
    $("cardImg").src = lastUrl;
    await $("cardImg").decode().catch(() => {});
    $("cardFrame").dataset.state = "ready";
    $("unlistedNote").hidden = card.listed !== false;
    $("unlistedNote").textContent = card.listed === false ? "名冊上沒有這個名字，先給你一組暫時序號。跟老師確認後可以重新領取。" : "";
    const canShare = !!(navigator.canShare && lastBlob && navigator.canShare({ files: [cardFile()] }));
    $("shareBtn").hidden = !canShare;
    if (next) { $("nextBtn").href = next; $("nextBtn").textContent = "回到剛才的頁面"; }
  }
  $("genBtn").addEventListener("click", async () => {
    const name = $("nameInput").value.trim().slice(0, 12);
    const g = groupOf(cfg, groupId);
    if (!name || !g) return;
    if (cfg.joinOpen === false) { show("stepClosed"); return; }
    $("genBtn").disabled = true;
    $("genBtn").textContent = "領取中…";
    try {
      const { serial, listed } = assignSerial(cfg, name, g.id);
      Card.set({ name, group: g.id, groupName: g.name, groupColor: g.color, serial, listed, issued: todayTW(), photo: avatarBitmap ? photoJpeg(avatarBitmap) : null });
      await showCard(Card.get());
      toast("小組成員證領取完成");
    } catch (e) {
      console.error(e);
      toast("領取失敗，再試一次");
      $("genBtn").disabled = false;
      $("genBtn").textContent = "領取成員證";
    }
  });

  const cardFile = () => new File([lastBlob], "小組成員證.jpg", { type: "image/jpeg" });
  $("shareBtn").addEventListener("click", async () => {
    if (!lastBlob) return;
    try { await navigator.share({ files: [cardFile()], title: "我的小組成員證", text: `我加入了${cfg.workshop.name}「${Card.get().groupName}」` }); }
    catch (e) { if (e && e.name !== "AbortError") toast("這個瀏覽器不支援分享，請改用下載"); }
  });
  $("dlBtn").addEventListener("click", () => {
    if (!lastUrl) return;
    const a = document.createElement("a");
    a.href = lastUrl; a.download = "小組成員證.jpg";
    document.body.append(a); a.click(); a.remove();
    toast("已開始下載，若沒反應請長按圖片儲存");
  });
  $("photoBtn").addEventListener("click", () => $("photoInput").click());
  $("photoInput").addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try {
      Card.set({ ...Card.get(), photo: photoJpeg(await loadAvatar(f)) });
      await showCard(Card.get());
      toast("照片換好了");
    } catch { toast("照片讀取失敗，換一張試試"); }
  });
  $("resetBtn").addEventListener("click", () => {
    Card.clear();
    groupId = ""; avatarBitmap = null;
    for (const o of $("groups").querySelectorAll(".chip")) o.setAttribute("aria-pressed", "false");
    $("toFormBtn").disabled = true;
    $("nameInput").value = "";
    $("genBtn").disabled = true;
    $("genBtn").textContent = "領取成員證";
    show("stepGroup"); setStep(0);
    toast("已清除，可以重新領取");
  });

  /* 進場：已經有證就直接秀證 */
  const local = Card.get();
  if (local) showCard(local).catch(() => toast("成員證載入失敗"));
  else if (cfg.joinOpen === false) show("stepClosed");
  else show("stepGroup");
})();
</script>
</body>
</html>
