<script>
const LESSONS={
 L22101:{title:'敘述性統計與資料摘要',analogy:'像看全班成績單：平均數看整體水準，標準差看差距，箱形圖幫你找出異常。',chips:['平均數與中位數','標準差與 IQR','偏態與峰度','相關分析']},
 L22102:{title:'機率分佈與資料分佈模型',analogy:'像看天氣機率：不是預言單一結果，而是描述每一種結果有多可能發生。',chips:['條件機率','貝氏定理','常見機率分佈','中央極限定理']},
 L22103:{title:'假設檢定與統計推論',analogy:'像法庭判決：先假設沒有差異，再看證據是否足以推翻原本的假設。',chips:['H0 與 H1','p 值與 α','單尾與雙尾','信賴區間']},
 L22201:{title:'數據收集與清理',analogy:'像煮菜前先洗菜挑菜：格式不一、缺失值、重複與錯字，都要先處理。',chips:['資料字典','缺失值','重複資料','資料洩漏']},
 L22202:{title:'數據儲存與管理',analogy:'像整理大型倉庫：不同貨物需要不同貨架、編碼與取用方法。',chips:['區塊／檔案／物件','SQL 與 NoSQL','HDFS','備份與一致性']},
 L22203:{title:'數據處理技術與工具',analogy:'像廚房分工：小份資料用單機，大量訂單就需要分散處理、批次與串流。',chips:['Pandas 與 SQL','ETL','Hadoop／Spark','縮放與 PCA']},
 L22301:{title:'統計學在大數據中的應用',analogy:'像從一整片森林取樣：資料多不代表沒有偏誤，還是要靠統計做可靠判斷。',chips:['型一型二錯誤','檢定力','多重檢定','偏差與方差']},
 L22302:{title:'常見的大數據分析方法',analogy:'像偵探依問題選工具：要找群體、找關聯、做預測或抓異常，用的方法都不同。',chips:['分類與迴歸','分群','關聯規則','模型評估']},
 L22303:{title:'數據可視化工具',analogy:'像替資料安排舞台：選對圖與視覺編碼，觀眾才會一眼看見真正重點。',chips:['Python 繪圖','BI 工具','視覺編碼','圖表選擇']}
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const viewport=$('#viewport'),world=$('#world'),modal=$('#modal');let current=null;
const defaultScale=()=>innerWidth<430?.46:innerWidth<760?.64:.93;
let view={rx:-7,ry:-4,scale:defaultScale()};
let drag=null,pinch=null,moved=false;const pointers=new Map();
const done=JSON.parse(localStorage.getItem('l22IslandDone')||'{}');
function renderView(){world.style.setProperty('--island-scale',view.scale);world.style.transform=`rotateX(${view.rx}deg) rotateY(${view.ry}deg) scale(${view.scale})`}
function resetView(){view={rx:-7,ry:-4,scale:defaultScale()};renderView()}
function renderDone(){$$('.planet').forEach(p=>p.classList.toggle('done',!!done[p.dataset.id]))}
function openLesson(id){const l=LESSONS[id];current=id;$('#modalCode').textContent=`${id} · L22 數據應用`;$('#modalTitle').textContent=l.title;$('#modalAnalogy').textContent=l.analogy;$('#modalChips').innerHTML=l.chips.map(x=>`<span>${x}</span>`).join('');$('#studyLink').href=`../l22-review/${id.toLowerCase()}.html`;$('#markDone').textContent=done[id]?'取消完成標記':'標記已複習 ✓';modal.classList.add('open');setTimeout(()=>$('#closeModal').focus(),50)}
function closeLesson(){modal.classList.remove('open');current=null}
$$('.planet').forEach(p=>p.addEventListener('click',()=>{if(!moved)openLesson(p.dataset.id)}));
const pointerDistance=()=>{const [a,b]=[...pointers.values()];return a&&b?Math.hypot(a.x-b.x,a.y-b.y):0};
viewport.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});viewport.setPointerCapture(e.pointerId);moved=false;if(pointers.size===1){drag={x:e.clientX,y:e.clientY,rx:view.rx,ry:view.ry};viewport.classList.add('dragging')}else if(pointers.size===2){pinch={d:pointerDistance(),scale:view.scale};drag=null;viewport.classList.remove('dragging')}});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&pinch){const d=pointerDistance();if(d){moved=true;view.scale=Math.max(.42,Math.min(1.35,pinch.scale*d/pinch.d));renderView()}return}if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;view.ry=Math.max(-55,Math.min(55,drag.ry+dx*.12));view.rx=Math.max(-28,Math.min(18,drag.rx-dy*.09));renderView()});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size===1){const p=[...pointers.values()][0];drag={x:p.x,y:p.y,rx:view.rx,ry:view.ry};pinch=null;viewport.classList.add('dragging')}else if(!pointers.size){drag=null;pinch=null;viewport.classList.remove('dragging');setTimeout(()=>moved=false,40)}}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{e.preventDefault();view.scale=Math.max(.42,Math.min(1.35,view.scale-e.deltaY*.0007));renderView()},{passive:false});
$('#closeModal').onclick=closeLesson;modal.addEventListener('click',e=>{if(e.target===modal)closeLesson()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLesson()});
$('#markDone').onclick=()=>{if(!current)return;done[current]=!done[current];localStorage.setItem('l22IslandDone',JSON.stringify(done));renderDone();$('#markDone').textContent=done[current]?'取消完成標記':'標記已複習 ✓'};
$('#resetBtn').onclick=resetView;
let sizeBucket=innerWidth<430?0:innerWidth<760?1:2;addEventListener('resize',()=>{const next=innerWidth<430?0:innerWidth<760?1:2;if(next!==sizeBucket){sizeBucket=next;resetView()}});

let audio=null,musicOn=false;
function createMusic(){if(audio)return audio;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const ctx=new AC(),master=ctx.createGain(),filter=ctx.createBiquadFilter();master.gain.value=.055;filter.type='lowpass';filter.frequency.value=1250;filter.Q.value=.7;filter.connect(master);master.connect(ctx.destination);const roots=[110,146.83,164.81,130.81],osc=[];roots.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;l.frequency.value=.035+i*.014;lg.gain.value=.018;l.connect(lg);lg.connect(g.gain);g.gain.value=.018;o.connect(g);g.connect(filter);o.start();l.start();osc.push(o,l)});const bell=()=>{if(!musicOn)return;const notes=[440,523.25,659.25,783.99],o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=notes[Math.floor(Math.random()*notes.length)];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+2.3)};const timer=setInterval(bell,3400);audio={ctx,master,filter,osc,timer};return audio}
async function setMusic(on){const a=createMusic();if(!a)return;musicOn=on;if(a.ctx.state==='suspended')await a.ctx.resume();a.master.gain.setTargetAtTime(on ? .055 : 0,a.ctx.currentTime,.25);$('#musicBtn').setAttribute('aria-pressed',String(on));$('#musicBtn .ico').textContent=on?'♫':'♩'}
$('#musicBtn').onclick=()=>setMusic(!musicOn);
$('#calmBtn').onclick=()=>{const on=!document.body.classList.contains('low-motion');document.body.classList.toggle('low-motion',on);$('#calmBtn').setAttribute('aria-pressed',String(on));if(on)setMusic(false);else renderView()};
function enter(withMusic){$('#intro').classList.add('hidden');if(withMusic)setMusic(true)}
$('#enterMusic').onclick=()=>enter(true);$('#enterQuiet').onclick=()=>enter(false);
renderDone();renderView();
</script>
