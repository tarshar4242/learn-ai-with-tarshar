<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-label="幸運草知識節點">
  <!-- 形象 C 固定符號：發光幸運草＋細線知識節點（放在每場右上，低亮度）-->
  <defs>
    <radialGradient id="g" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8FD14F" stop-opacity=".55"/><stop offset="1" stop-color="#8FD14F" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g fill="none" stroke="#74835A" stroke-opacity=".35" stroke-width="1.2">
    <circle cx="400" cy="230" r="150"/>
    <circle cx="400" cy="230" r="205" stroke-dasharray="4 10"/>
    <circle cx="400" cy="230" r="96" stroke-dasharray="2 8"/>
    <path d="M400 230 L240 120"/><path d="M400 230 L200 260"/><path d="M400 230 L250 400"/><path d="M400 230 L560 430" stroke-dasharray="3 8"/><path d="M400 230 L540 80"/>
  </g>
  <g fill="#FFFDF8" stroke="#74835A" stroke-opacity=".6" stroke-width="1.5">
    <circle cx="240" cy="120" r="24"/><circle cx="200" cy="260" r="24"/><circle cx="250" cy="400" r="24"/><circle cx="560" cy="430" r="20"/><circle cx="540" cy="80" r="20"/>
  </g>
  <!-- 節點圖示：對話、文件、燈泡、人、清單 -->
  <g fill="none" stroke="#5E6E44" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 113h20v12h-12l-6 5v-5h-2z"/>
    <path d="M192 250h12l4 4v14h-16z M196 258h8 M196 263h8"/>
    <path d="M250 390a7 7 0 0 1 4 13v3h-8v-3a7 7 0 0 1 4-13z M247 409h6"/>
    <circle cx="556" cy="426" r="4"/><path d="M549 438a7 7 0 0 1 14 0"/>
    <path d="M532 74h16 M532 80h16 M532 86h10"/>
  </g>
  <g fill="#8FD14F" fill-opacity=".9">
    <circle cx="300" cy="140" r="3"/><circle cx="470" cy="360" r="3"/><circle cx="330" cy="330" r="2.5"/><circle cx="520" cy="190" r="2.5"/>
  </g>
  <!-- 發光幸運草 -->
  <circle cx="400" cy="230" r="120" fill="url(#g)" filter="url(#blur)"/>
  <g transform="translate(400 230)">
    <g fill="#2F8F62">
      <ellipse cx="-30" cy="-30" rx="32" ry="32"/><ellipse cx="30" cy="-30" rx="32" ry="32"/><ellipse cx="-30" cy="30" rx="32" ry="32"/><ellipse cx="30" cy="30" rx="32" ry="32"/>
    </g>
    <g fill="#8FD14F" fill-opacity=".85">
      <circle cx="-30" cy="-30" r="20"/><circle cx="30" cy="-30" r="20"/><circle cx="-30" cy="30" r="20"/><circle cx="30" cy="30" r="20"/>
    </g>
    <path d="M8 40 Q40 90 20 130" stroke="#8FD14F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle r="7" fill="#E9FFD6"/>
  </g>
</svg>
