name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 雙路徑檢索台：依 tools/dual-search/sources 重抓法規、切 PDF、算向量、打包成 public/thesis-library/tools/dual-search/index.html
      # 失敗時不擋整站部署，沿用 repo 裡已有的 index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dual-search corpus
        continue-on-error: true
        run: |
          pip install pymupdf
          cd tools/dual-search && npm ci && python3 pipeline.py && node embed_build.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
