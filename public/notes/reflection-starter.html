<style>:root{--bg:#fbfaf6;--ink:#3c3935;--muted:#736d66;--rose:#a96172;--green:#3f8560;--line:#eadfe1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#f8e9ed,transparent 38%),var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.9}.top{padding:14px 5vw;border-bottom:1px solid var(--line);background:#ffffffdc;position:sticky;top:0;backdrop-filter:blur(12px)}.top a{color:var(--green);text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:auto;padding:54px 22px 84px;text-align:center}.tag{color:var(--rose);font-weight:900}h1{font-size:clamp(32px,7vw,56px);line-height:1.3;margin:12px 0}.lead{font-size:18px;color:var(--muted)}.card{margin-top:30px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(24px,6vw,50px);box-shadow:0 20px 54px #7b47581b}.pause{text-align:center;font-size:42px;margin-bottom:12px}.question{font-size:clamp(22px,5vw,32px);line-height:1.5;font-weight:900;color:var(--rose);padding:20px 0}.prompts{display:grid;gap:12px}.prompt{padding:16px 18px;border-radius:16px;background:#fdf6f8;border:1px solid var(--line)}.closing{margin-top:24px;color:var(--muted)}footer{color:var(--muted);margin-top:38px;font-size:13px}</style></head>
<body><nav class="top"><a href="../plans/" onclick="if(history.length&gt;1){history.back();return false}">← 回上一頁</a></nav><main class="wrap"><div class="tag">陪伴練習</div><h1>從一個問題開始</h1><p class="lead">用一個不急著解決的問題，練習看見當下真正的需要。</p>
<article class="card"><div class="pause">🍃</div><p>請先讓自己安靜一分鐘，然後寫下：</p><div class="question">現在的我，最希望有人理解的是什麼？</div><div class="prompts"><div class="prompt">先不要分析對錯，也不用立刻找解法。</div><div class="prompt">只描述發生了什麼、你有什麼感受，以及你此刻需要什麼。</div><div class="prompt">最後替今天留一句溫柔但具體的行動提醒。</div></div><p class="closing">你不必一次想清楚全部，只要先誠實地看見眼前這一步。</p></article>
