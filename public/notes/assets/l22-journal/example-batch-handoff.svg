<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 1320" role="img" aria-labelledby="l22-batch-title l22-batch-desc" xmlns="http://www.w3.org/2000/svg" id="L22-root">
    <title id="l22-batch-title">L22 一批題目的三方接力實例</title>
    <desc id="l22-batch-desc">三條泳道分別是 Tarshar、CC 與知臨。流程由 Tarshar 作答開始，經 CC 批改與白話教學、Tarshar 確認理解、CC 交班，再由知臨更新進度、製作圖卡並安排回測。</desc>
    <defs>
      <style>#L22-root { color: #173c32; font-family: "PingFang TC","Microsoft JhengHei",sans-serif; }
      #L22-root .lead { font-size:18px;line-height:1.7;color:#4f5d75;margin:0 0 22px }
      #L22-root .diagram-container { width:100%;overflow-x:auto;border:1px solid rgba(23,60,50,.14);background:#fffdf7 }
      #L22-root .download-note { font-size:14px;color:#4f5d75;margin:14px 0 0 }
      @media(max-width:700px) {
#L22-root .lead { font-size:16px }
}
      @media print {
#L22-root .diagram-container { overflow-x:visible }
}</style>
      <marker id="L22-l22-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4f5d75"/></marker>
      <marker id="L22-l22-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a8442c"/></marker>
      <pattern id="L22-l22-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#173c32" stroke-opacity=".035" stroke-width="1"/></pattern>
    </defs>

    <rect width="960" height="1320" fill="#fff9ee"/>
    <rect x="40" y="40" width="880" height="1216" fill="url(#L22-l22-grid)" stroke="#173c32" stroke-opacity=".16"/>
    <rect x="40" y="40" width="880" height="96" fill="#f5ead7"/>
    <line x1="333" y1="40" x2="333" y2="1256" stroke="#173c32" stroke-opacity=".16"/>
    <line x1="626" y1="40" x2="626" y2="1256" stroke="#173c32" stroke-opacity=".16"/>

    <circle cx="96" cy="88" r="24" fill="#a8442c"/><text x="96" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#fff9ee">T</text>
    <text x="132" y="82" font-size="20" font-weight="700" fill="#173c32">Tarshar</text><text x="132" y="108" font-size="13" fill="#4f5d75">作答、提問、確認理解</text>
    <circle cx="389" cy="88" r="24" fill="#819b3e"/><text x="389" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#fff9ee">CC</text>
    <text x="425" y="82" font-size="20" font-weight="700" fill="#173c32">CC</text><text x="425" y="108" font-size="13" fill="#4f5d75">出題、批改、白話教學</text>
    <circle cx="682" cy="88" r="24" fill="#2e5aa8"/><text x="682" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#fff9ee">知</text>
    <text x="718" y="82" font-size="20" font-weight="700" fill="#173c32">知臨</text><text x="718" y="108" font-size="13" fill="#4f5d75">核對、彙整、製卡、回測</text>

    <!-- connectors first -->
    <path d="M188 286H360" fill="none" stroke="#4f5d75" stroke-width="3" marker-end="url(#L22-l22-arrow)"/>
    <path d="M480 390V470" fill="none" stroke="#4f5d75" stroke-width="3" marker-end="url(#L22-l22-arrow)"/>
    <path d="M360 582H188V666" fill="none" stroke="#a8442c" stroke-width="3" marker-end="url(#L22-l22-arrow-accent)"/>
    <path d="M188 770H360" fill="none" stroke="#a8442c" stroke-width="3" marker-end="url(#L22-l22-arrow-accent)"/>
    <path d="M480 876V964H648" fill="none" stroke="#4f5d75" stroke-width="3" marker-end="url(#L22-l22-arrow)"/>
    <path d="M772 1068V1136" fill="none" stroke="#4f5d75" stroke-width="3" marker-end="url(#L22-l22-arrow)"/>
    <path d="M156 666V620H320V526H360" fill="none" stroke="#4f5d75" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#L22-l22-arrow)"/>

    <rect x="310" y="265" width="44" height="28" fill="#fff9ee"/><text x="332" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#4f5d75">交卷</text>
    <rect x="493" y="418" width="104" height="28" fill="#fff9ee"/><text x="545" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#4f5d75">需要說明</text>
    <rect x="228" y="638" width="104" height="28" fill="#fff9ee"/><text x="280" y="658" text-anchor="middle" font-size="13" font-weight="600" fill="#4f5d75">換一個例子</text>
    <rect x="310" y="749" width="44" height="28" fill="#fff9ee"/><text x="332" y="769" text-anchor="middle" font-size="12" font-weight="600" fill="#a8442c">懂了</text>
    <rect x="602" y="944" width="44" height="28" fill="#fff9ee"/><text x="624" y="964" text-anchor="middle" font-size="12" font-weight="600" fill="#4f5d75">交班</text>

    <!-- nodes -->
    <g>
      <rect x="72" y="180" width="232" height="212" rx="8" fill="#fff" stroke="#173c32" stroke-width="1.2"/>
      <rect x="88" y="196" width="76" height="26" rx="3" fill="#f5ead7"/><text x="126" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#173c32">01 作答</text>
      <text x="92" y="254" font-size="18" font-weight="700" fill="#173c32">一批出現 10 題</text>
      <text x="92" y="288" font-size="15" fill="#4f5d75">我選 8 題</text>
      <text x="92" y="318" font-size="15" fill="#4f5d75">2 題留白／問號</text>
      <text x="92" y="356" font-size="13" fill="#a8442c">空白不算首輪完成</text>
    </g>
    <g>
      <rect x="360" y="180" width="240" height="212" rx="8" fill="#fff" stroke="#173c32" stroke-width="1.2"/>
      <rect x="376" y="196" width="76" height="26" rx="3" fill="#e8efdb"/><text x="414" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#173c32">02 批改</text>
      <text x="380" y="254" font-size="18" font-weight="700" fill="#173c32">8 題才列入統計</text>
      <text x="380" y="288" font-size="15" fill="#4f5d75">4 對／4 錯</text>
      <text x="380" y="318" font-size="15" fill="#4f5d75">2 題仍是未作答</text>
      <text x="380" y="356" font-size="13" fill="#4f5d75">先給答案，再說理由</text>
    </g>
    <g>
      <rect x="360" y="470" width="240" height="224" rx="8" fill="#fff" stroke="#173c32" stroke-width="1.2"/>
      <rect x="376" y="486" width="100" height="26" rx="3" fill="#e8efdb"/><text x="426" y="504" text-anchor="middle" font-size="12" font-weight="700" fill="#173c32">03 用例子教</text>
      <text x="380" y="548" font-size="17" font-weight="700" fill="#173c32">先做動作，再放名詞</text>
      <text x="380" y="584" font-size="14" fill="#4f5d75">性別 × 飲料</text>
      <text x="380" y="612" font-size="14" fill="#4f5d75">→ 可以交叉數人數</text>
      <text x="380" y="648" font-size="14" fill="#4f5d75">身高 × 體重</text>
      <text x="380" y="676" font-size="14" fill="#4f5d75">→ 不是列聯表</text>
    </g>
    <g>
      <rect x="72" y="666" width="232" height="208" rx="8" fill="#fff4ec" stroke="#a8442c" stroke-width="2"/>
      <rect x="88" y="682" width="100" height="26" rx="3" fill="#f8e3d8"/><text x="138" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#a8442c">04 理解閘門</text>
      <text x="92" y="744" font-size="18" font-weight="700" fill="#173c32">我能自己分辨嗎？</text>
      <text x="92" y="782" font-size="15" fill="#4f5d75">能：往交班走</text>
      <text x="92" y="812" font-size="15" fill="#4f5d75">不能：回去換例子</text>
      <text x="92" y="850" font-size="13" fill="#a8442c">只說「講過」不算懂</text>
    </g>
    <g>
      <rect x="360" y="770" width="240" height="212" rx="8" fill="#fff4ec" stroke="#a8442c" stroke-width="2"/>
      <rect x="376" y="786" width="100" height="26" rx="3" fill="#f8e3d8"/><text x="426" y="804" text-anchor="middle" font-size="12" font-weight="700" fill="#a8442c">05 寫交班</text>
      <text x="380" y="850" font-size="18" font-weight="700" fill="#173c32">只交必要欄位</text>
      <text x="380" y="886" font-size="14" fill="#4f5d75">題號／作答狀態</text>
      <text x="380" y="916" font-size="14" fill="#4f5d75">理解證據／是否製卡</text>
      <text x="380" y="954" font-size="13" fill="#a8442c">不複製付費題文</text>
    </g>
    <g>
      <rect x="648" y="906" width="248" height="184" rx="8" fill="#fff" stroke="#173c32" stroke-width="1.2"/>
      <rect x="664" y="922" width="100" height="26" rx="3" fill="#e3ecfa"/><text x="714" y="940" text-anchor="middle" font-size="12" font-weight="700" fill="#173c32">06 核對彙整</text>
      <text x="668" y="986" font-size="18" font-weight="700" fill="#173c32">進度 46 → 54</text>
      <text x="668" y="1022" font-size="14" fill="#4f5d75">新增 8 題，不是 10 題</text>
      <text x="668" y="1054" font-size="13" fill="#4f5d75">正確率與未答分開記</text>
    </g>
    <g>
      <rect x="648" y="1136" width="248" height="88" rx="8" fill="#fff" stroke="#173c32" stroke-width="1.2"/>
      <text x="668" y="1172" font-size="17" font-weight="700" fill="#173c32">07 圖卡＋D1／D3／D7回測</text>
      <text x="668" y="1202" font-size="13" fill="#4f5d75">成品是學習鷹架，不是答對證明</text>
    </g>

    <text x="64" y="1292" font-size="13" fill="#4f5d75">Tarshar陪你學L22 🍀　｜　例子、理解證據、交班與回測缺一不可</text>
  </svg>
