  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); fitView(); }); resize();

// 自動縮放並置中，把所有可見節點框進畫面
function fitView(pad = 70) {
  const act = NODES.filter(visible);
  if (!act.length) return;
  const xs = act.map(n => n.x), ys = act.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
  const topPad = (topbarEl?.offsetHeight || 46) + 14;
  const botPad = (window.innerWidth <= 820 ? (legend?.offsetHeight || 90) : 0) + 20;
  const availH = Math.max(120, H - topPad - botPad);
  scale = Math.min(3.2, Math.max(0.2, Math.min((W - pad * 2) / w, (availH - pad) / h)));
  ox = W / 2 - ((minX + maxX) / 2) * scale;
  oy = topPad + availH / 2 - ((minY + maxY) / 2) * scale;
}

const visible = n => !hidden.has(n.cat);
const matches = n => query && (n.id.toLowerCase().includes(query) || (n.desc || '').toLowerCase().includes(query));

// ── 力導向模擬 ──
let alpha = 1;
let dragNode = null, panning = false, lx = 0, ly = 0;
function step() {
  if (alpha < 0.005) return;
  const act = NODES.filter(visible);
  // 斥力（節點數少，O(n²) 足夠）
  for (let i = 0; i < act.length; i++) {
    const a = act[i];
    for (let j = i + 1; j < act.length; j++) {
      const b = act[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = (Math.random() - .5); dy = (Math.random() - .5); d2 = 1; }
      if (d2 > 90000) continue;
      const f = 620 / d2, d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  // 引力：實際呼叫拉得緊，同分類拉得鬆
  const pull = (arr, k, len) => arr.forEach(l => {
    const a = byId[l.s], b = byId[l.t];
    if (!a || !b || !visible(a) || !visible(b)) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - len) * k;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  });
  pull(realLinks, 0.020, 78);
  if (showCatLinks) pull(catLinks, 0.006, 130);
  // 回到中心 + 阻尼
  act.forEach(n => {
    if (n === dragNode) return;
    n.vx -= n.x * 0.0016; n.vy -= n.y * 0.0016;
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx * alpha; n.y += n.vy * alpha;
  });
  alpha *= 0.994;
}

// ── 繪圖 ──
const sx = n => n.x * scale + ox, sy = n => n.y * scale + oy;
function draw() {
  ctx.clearRect(0, 0, W, H);
  const dim = query !== '' || selected;
  const near = new Set();
  if (selected) { near.add(selected.id); selected.calls.forEach(x => near.add(x)); selected.calledBy.forEach(x => near.add(x)); }

  if (showCatLinks) {
    ctx.strokeStyle = 'rgba(150,142,168,.16)'; ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]); ctx.beginPath();
    catLinks.forEach(l => {
      const a = byId[l.s], b = byId[l.t];
      if (!visible(a) || !visible(b)) return;
      ctx.moveTo(sx(a), sy(a)); ctx.lineTo(sx(b), sy(b));
    });
    ctx.stroke(); ctx.setLineDash([]);
  }

  realLinks.forEach(l => {
    const a = byId[l.s], b = byId[l.t];
    if (!visible(a) || !visible(b)) return;
    const hot = selected && (near.has(a.id) && near.has(b.id));
    ctx.strokeStyle = hot ? 'rgba(106,90,207,.85)' : (dim ? 'rgba(120,112,140,.15)' : 'rgba(120,112,140,.42)');
    ctx.lineWidth = hot ? 2 : 1.15;
    ctx.beginPath(); ctx.moveTo(sx(a), sy(a)); ctx.lineTo(sx(b), sy(b)); ctx.stroke();
  });

  NODES.forEach(n => {
    if (!visible(n)) return;
    const hot = (selected && near.has(n.id)) || (query && matches(n));
    const faded = dim && !hot;
    ctx.globalAlpha = faded ? 0.2 : 1;
    ctx.beginPath(); ctx.arc(sx(n), sy(n), n.r * Math.min(scale, 1.6), 0, 7);
    ctx.fillStyle = n.colour; ctx.fill();
    if (selected && n.id === selected.id) {
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#33302b'; ctx.stroke();
    }
    if (scale > 0.95 || hot || n.deg >= 2) {
      ctx.globalAlpha = faded ? 0.22 : 1;
      ctx.fillStyle = '#33302b';
      ctx.font = (hot ? '700 ' : '') + Math.max(9.5, 11 * Math.min(scale, 1.25)) + 'px system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(n.id, sx(n), sy(n) - n.r * Math.min(scale, 1.6) - 4);
    }
    ctx.globalAlpha = 1;
  });
}
let fitted = false, fitStage = 0;
const FIT_AT = [0.30, 0.10, 0.03];   // 分三階段框，最後一次是真正穩定後
function loop() {
  step(); draw();
  if (!fitted && fitStage < FIT_AT.length && alpha < FIT_AT[fitStage]) {
    fitView();
    fitStage++;
    if (fitStage >= FIT_AT.length) fitted = true;
  }
  requestAnimationFrame(loop);
}
fitView();
loop();

// ── 互動 ──
const pick = (px, py) => NODES.filter(visible).find(n =>
  Math.hypot(sx(n) - px, sy(n) - py) < Math.max(10, n.r * scale + 6));

function down(px, py) {
  const n = pick(px, py);
  if (n) { dragNode = n; select(n); } else { panning = true; }
  lx = px; ly = py; cv.classList.add('dragging');
}
function move(px, py) {
  if (dragNode) { dragNode.x = (px - ox) / scale; dragNode.y = (py - oy) / scale; alpha = Math.max(alpha, .35); }
  else if (panning) { ox += px - lx; oy += py - ly; }
  lx = px; ly = py;
}
function up() { dragNode = null; panning = false; cv.classList.remove('dragging'); }

cv.addEventListener('mousedown', e => down(e.clientX, e.clientY));
window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
window.addEventListener('mouseup', up);
cv.addEventListener('touchstart', e => { const t = e.touches[0]; down(t.clientX, t.clientY); }, { passive: true });
cv.addEventListener('touchmove', e => { if (e.touches.length === 1) { const t = e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); } }, { passive: false });
cv.addEventListener('touchend', up);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.min(3.2, Math.max(0.28, scale * k));
  ox = e.clientX - (e.clientX - ox) * (ns / scale);
  oy = e.clientY - (e.clientY - oy) * (ns / scale);
  scale = ns;
}, { passive: false });

// 手機雙指縮放
let pinch = 0;
cv.addEventListener('touchstart', e => {
  if (e.touches.length === 2) pinch = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
}, { passive: true });
cv.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const ns = Math.min(3.2, Math.max(0.28, scale * (d / pinch)));
    ox = cx - (cx - ox) * (ns / scale); oy = cy - (cy - oy) * (ns / scale);
    scale = ns; pinch = d; e.preventDefault();
  }
}, { passive: false });
cv.addEventListener('touchend', () => { pinch = 0; });

// ── 側欄 ──
function select(n) {
  selected = n;
  document.getElementById('pName').textContent = n.id;
  const c = document.getElementById('pCat');
  c.textContent = n.cat; c.style.background = n.colour;
  document.getElementById('pDesc').textContent = n.desc || '（這個 skill 沒有寫描述）';
  const fill = (el, arr) => {
    el.innerHTML = '';
    if (!arr.length) { el.innerHTML = '<div class="none">沒有</div>'; return; }
    arr.forEach(id => {
      const a = document.createElement('a');
      a.className = 'lk'; a.href = '#'; a.textContent = '→ ' + id;
      a.onclick = ev => { ev.preventDefault(); if (byId[id]) { select(byId[id]); focusOn(byId[id]); } };
      el.appendChild(a);
    });
  };
  fill(document.getElementById('pCalls'), n.calls);
  fill(document.getElementById('pBy'), n.calledBy);
  panel.classList.add('on');
}
function focusOn(n) { ox = W / 2 - n.x * scale; oy = H / 2 - n.y * scale; }
document.getElementById('closePanel').onclick = () => { panel.classList.remove('on'); selected = null; };

// ── 圖例（可點擊篩選，附全選／清除）──
const counts = {};
NODES.forEach(n => counts[n.cat] = (counts[n.cat] || 0) + 1);
const legendRowEls = [];   // [分類名稱, 該列的 DOM]

function redrawAfterFilter() {
  legendRowEls.forEach(([label, el]) => el.classList.toggle('off', hidden.has(label)));
  alpha = Math.max(alpha, .5); fitted = false; fitStage = 0;
}

CATS.forEach(([label, colour]) => {
  if (!counts[label]) return;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<span class="dot" style="background:' + colour + '"></span><span>' +
                  label + '</span><span class="n">' + counts[label] + '</span>';
  row.onclick = () => {
    hidden.has(label) ? hidden.delete(label) : hidden.add(label);
    redrawAfterFilter();
  };
  legendRows.appendChild(row);
  legendRowEls.push([label, row]);
});

document.getElementById('allOn').addEventListener('click', e => {
  e.stopPropagation();
  hidden.clear();
  redrawAfterFilter();
});
document.getElementById('allOff').addEventListener('click', e => {
  e.stopPropagation();
  legendRowEls.forEach(([label]) => hidden.add(label));
  redrawAfterFilter();
});

// ── 搜尋與開關 ──
qInput.addEventListener('input', e => {
  query = e.target.value.trim().toLowerCase();
  if (query) {
    const hit = NODES.filter(n => visible(n) && matches(n));
    if (hit.length === 1) { select(hit[0]); focusOn(hit[0]); }
  }
});
document.getElementById('onlyReal').addEventListener('change', e => {
  showCatLinks = !e.target.checked; alpha = Math.max(alpha, .6); fitted = false; fitStage = 0;
});
document.getElementById('fitBtn').addEventListener('click', () => fitView());
document.getElementById('fold').addEventListener('click', e => {
  e.stopPropagation();
  legend.classList.toggle('min');
  e.target.textContent = legend.classList.contains('min') ? '▸' : '▾';
});

</script>
</body>
</html>
