<style>:root{--bg:#fbfaf6;--ink:#343b35;--muted:#687169;--green:#3f8560;--line:#dce8df}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 5%,#eaf5ec,transparent 34%),var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}.top{padding:14px 5vw;border-bottom:1px solid var(--line);background:#ffffffdc;position:sticky;top:0;backdrop-filter:blur(12px)}.top a{color:var(--green);text-decoration:none;font-weight:800}.wrap{max-width:920px;margin:auto;padding:54px 22px 84px}.tag{color:var(--green);font-weight:900}h1{font-size:clamp(32px,7vw,58px);line-height:1.25;margin:12px 0}.lead{font-size:18px;color:var(--muted)}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}.rule{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 16px 40px #315d4118}.n{width:44px;height:44px;display:grid;place-items:center;background:var(--green);color:#fff;border-radius:14px;font-weight:900;font-size:20px}.rule h2{font-size:20px}.closing{margin-top:22px;padding:24px;border-radius:20px;background:#edf6ef;font-weight:800}footer{text-align:center;color:var(--muted);margin-top:38px;font-size:13px}@media(max-width:720px){.rules{grid-template-columns:1fr}}</style></head>
<body><nav class="top"><a href="../plans/" onclick="if(history.length&gt;1){history.back();return false}">← 回上一頁</a></nav><main class="wrap"><div class="tag">操作指南</div><h1>可控分享的三條規則</h1><p class="lead">範圍、期限、撤銷，是每次分享都要先決定的三件事。</p>
<div class="rules"><section class="rule"><div class="n">1</div><h2>決定分享範圍</h2><p>只選這次真正需要的內容，不把整座知識庫一起交出去。</p></section><section class="rule"><div class="n">2</div><h2>決定有效期限</h2><p>朋友測試可用七天，長期合作再延長，讓每次開放都有清楚終點。</p></section><section class="rule"><div class="n">3</div><h2>保留撤銷能力</h2><p>當情境改變，可以立即停止原網址的讀取權，而不必刪除自己的內容。</p></section></div>
<div class="closing">內容永遠留在知識湖；停止的是別人的讀取權。</div><footer>🍀 Learn AI with Tarshar | 2026</footer></main></body></html>
