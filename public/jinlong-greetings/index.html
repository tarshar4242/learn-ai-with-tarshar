<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff1f6">
  <meta name="description" content="選一選，複製貼上就能畫圖。進龍專屬的日安圖提示詞生成器。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="進龍日安圖">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>進龍日安圖</title>
  <script defer src="./assets/vendor/lunar.js"></script>
  <script defer src="./data.js"></script>
  <script defer src="./script.js"></script>
</head>
<body>
  <main id="choices" class="app-card">
    <header class="app-header">
      <div class="brand-line">
        <span class="brand-mark" aria-hidden="true">☀</span>
        <span>進龍專屬</span>
        <span class="version">V5.1</span>
      </div>
      <h1>進龍日安圖</h1>
      <p>選一選，複製貼上就能畫圖 ♡</p>
    </header>

    <p id="boot-warning" class="notice">若選項沒有出現，請重新整理，或改用 Safari／Chrome 開啟。</p>
    <noscript><p class="notice">請在瀏覽器設定啟用 JavaScript，再重新整理。</p></noscript>

    <form id="builder">
      <fieldset>
        <legend><span class="step">1</span>問候類型</legend>
        <div id="greetings" class="greeting-grid"></div>
        <div id="holiday-panel" class="holiday-panel" hidden>
          <div id="holiday-modes" class="mode-grid">
            <button type="button" data-mode="auto" aria-pressed="true">自動推薦</button>
            <button type="button" data-mode="manual" aria-pressed="false">自己輸入</button>
          </div>
          <div id="holiday-auto"><p id="holiday-status" role="status"></p></div>
          <div id="holiday-manual" hidden>
            <label for="festival-name">節日名稱</label>
            <input id="festival-name" type="text" maxlength="16" placeholder="例如：中秋節" autocomplete="off">
            <div id="festival-chips" class="chips" hidden></div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend><span class="step">2</span>圖片系列</legend>
        <div id="categories" class="category-grid"></div>
        <div class="tone-wrap" role="group" aria-labelledby="tone-label">
          <span id="tone-label" class="tone-label">畫面感覺</span>
          <div id="tones" class="tone-grid"></div>
        </div>
      </fieldset>

      <fieldset class="signature-field">
        <legend><span class="step">3</span>圖片落款</legend>
        <label class="sr-only" for="signature">放在圖片下方的問候</label>
        <select id="signature"></select>
      </fieldset>

      <p id="form-error" class="notice" role="alert" hidden></p>
      <button id="generate" type="submit" class="primary big">產生畫圖指令 <span aria-hidden="true">♪</span></button>
    </form>

    <p id="storage-status" class="storage-status" role="status"></p>
    <footer>🍀 羅靜娟・2026</footer>
  </main>

  <section id="result" class="result" aria-labelledby="result-title" hidden tabindex="-1">
    <div class="result-card">
      <button id="close-result" class="close-result" type="button" aria-label="返回修改">×</button>
      <span class="eyebrow">心意準備好了 ♡</span>
      <h2 id="result-title">畫圖指令已備妥</h2>
      <p id="summary" class="summary"></p>
      <div class="blessing-preview">
        <span id="preview-title"></span>
        <p id="preview-blessing"></p>
        <span id="preview-signature"></span>
      </div>
      <button id="copy" class="primary big" type="button">複製畫圖指令</button>
      <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      <div class="ai-links">
        <a class="button" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">開啟 ChatGPT ↗</a>
        <a class="button" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">開啟 Gemini ↗</a>
      </div>
      <div class="result-actions">
        <button id="shuffle" class="secondary" type="button">↻ 換一張</button>
        <button id="edit-settings" class="secondary" type="button">返回修改</button>
      </div>
      <details id="prompt-details">
        <summary>手動複製文字</summary>
        <label class="sr-only" for="prompt-text">完整畫圖指令</label>
        <textarea id="prompt-text" rows="8" readonly spellcheck="false"></textarea>
        <button id="select-text" type="button" class="secondary">全選文字</button>
      </details>
    </div>
  </section>
</body>
</html>
